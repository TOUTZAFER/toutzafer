<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0020fe">
<title>Page introuvable · Tout’zafer</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/img/ico/favicon.svg">
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Inter";font-style:normal;font-display:swap;font-weight:100 900;src:url(/fonts/inter-latin.woff2) format("woff2")}
@font-face{font-family:"Inter Tight";font-style:normal;font-display:swap;font-weight:800;src:url(/fonts/inter-tight-latin-800.woff2) format("woff2")}
:root{--brand:#0020fe;--fg:#111318;--muted:#4b5160;--line:#e3e5ea}
*{box-sizing:border-box}
body{margin:0;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:var(--fg);background:#fff;-webkit-font-smoothing:antialiased}
header{background:var(--brand);padding:0 max(16px,env(safe-area-inset-left,0px))}
header .in{max-width:1080px;margin:0 auto;height:52px;display:flex;align-items:center}
header img{display:block;height:30px;width:auto}
main{max-width:640px;margin:0 auto;padding:72px 20px 96px;text-align:center}
.code{font-family:"Inter Tight","Inter",sans-serif;font-weight:800;font-size:clamp(72px,18vw,120px);line-height:1;letter-spacing:-.04em;color:var(--brand);margin:0}
h1{font-family:"Inter Tight","Inter",sans-serif;font-weight:800;font-size:clamp(24px,5vw,32px);letter-spacing:-.02em;margin:14px 0 10px}
p{color:var(--muted);line-height:1.55;margin:0 auto 28px;max-width:42ch}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;text-decoration:none;font-weight:700;border-radius:980px;padding:14px 24px}
.btn:hover{filter:brightness(1.1)}
nav{margin-top:40px;padding-top:28px;border-top:1px solid var(--line)}
nav span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:14px}
nav a{display:inline-block;margin:4px;padding:8px 16px;border:1px solid var(--line);border-radius:980px;color:var(--fg);text-decoration:none;font-size:14px;font-weight:600}
nav a:hover{border-color:var(--fg)}
</style>
</head>
<body>
<header><div class="in"><a href="/" aria-label="Tout’zafer, accueil"><img src="/img/logo/wordmark.svg" alt="Tout’zafer" width="95" height="30"></a></div></header>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>Cette page est introuvable</h1>
  <p>L’adresse est peut-être mal écrite, ou l’article n’est plus en vente. Tout le reste du catalogue vous attend dans la boutique.</p>
  <a class="btn" href="/">Voir la boutique</a>
  <nav aria-label="Catégories"><span>Ou choisissez une catégorie</span>
    <a href="/cuisine">Cuisine</a><a href="/rangement">Rangement</a><a href="/maison">Maison</a><a href="/bebe-enfants">Bébé &amp; enfants</a><a href="/animaux">Animaux</a>
  </nav>
</main>
</body>
</html>
